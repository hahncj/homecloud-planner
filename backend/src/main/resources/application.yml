spring:
  application:
    name: planner
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/homecloud}
    username: ${SPRING_DATASOURCE_USERNAME:homecloud}
    password: ${SPRING_DATASOURCE_PASSWORD:change-me}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

server:
  port: 8080
  tomcat:
    max-http-form-post-size: 2MB
    max-swallow-size: 2MB
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        # Not forced true: a typical deployment of this app is plain HTTP on a
        # local network (see docs/security.md). Set SESSION_COOKIE_SECURE=true
        # when serving over HTTPS.
        secure: ${SESSION_COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
